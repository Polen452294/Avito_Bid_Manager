[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-bid-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "SQLAlchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "alembic>=1.14,<2", "APScheduler>=3.11,<4", "aiogram>=3.17,<4", "tzdata>=2025.1", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.avito" = ["contracts_snapshot.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

